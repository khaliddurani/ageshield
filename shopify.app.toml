# Production app config. Verify keys against current Shopify CLI docs before first deploy.
client_id = "REPLACE_WITH_PRODUCTION_CLIENT_ID"   # Dev Dashboard → AgeShield (production) → Client ID
name = "AgeShield"                                # brand first, <= 30 chars, must match listing
handle = "ageshield"                              # set by Shopify when the app is created; keep wrangler SHOPIFY_APP_HANDLE in sync
application_url = "https://ageshield.merchantkits.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# Keep minimal. Each scope must be used by shipped code (docs/SCOPES.md justifies each one for app review).
# read_products: expand collection/tag rules to products and read product tags for the age-restriction sync.
# write_products: set/remove the app-owned product metafield $app.age_restricted (no other product data is written).
# read_themes: show on the Dashboard whether the Age gate app embed is enabled in the live theme.
# read_markets: read the store's market domains (webPresences) so shoppers return to the domain they shop on.
scopes = "read_products,write_products,read_themes,read_markets"
use_legacy_install_flow = false          # MANDATORY — SignShield lesson (req. 2.3.2)

[auth]
redirect_urls = [ "https://ageshield.merchantkits.com/auth/callback" ]   # required field; managed install does not use it

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update" ]
  uri = "/webhooks/products"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[app_proxy]
url = "https://ageshield.merchantkits.com/proxy"
prefix = "apps"
subpath = "ageshield"

[pos]
embedded = false

# App-owned product metafield ($app.age_restricted): minimum age (15, 16, 18 or 21) of a restricted product, written by
# the app from the merchant's rules. Read by the Age gate app embed (product.metafields['$app'].age_restricted) and by
# the Phase 2 cart/checkout validation Function. Keep in sync with shopify.app.staging.toml.
[product.metafields.app.age_restricted]
type = "number_integer"
name = "Age restriction"
description = "Minimum age to buy this product. Set by AgeShield from your restricted-product rules."
access.admin = "merchant_read"
access.storefront = "public_read"
